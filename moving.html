<main class="moving-page">

  <section class="film">
    <video id="film1" autoplay muted loop playsinline>
      <source src="/videos/film1.mp4" type="video/mp4">
    </video>
    <div class="film-title">untitled I</div>
  </section>

  <section class="film">
    <video id="film2" autoplay muted loop playsinline>
      <source src="/videos/film2.mp4" type="video/mp4">
    </video>
    <div class="film-title">untitled II</div>
  </section>

</main>

<script>
window.onload = function() {
  var videos = document.getElementsByTagName("video");

  for (var i = 0; i < videos.length; i++) {
    videos[i].addEventListener("click", function() {
      this.muted = !this.muted;
    });
  }
};
</script>
